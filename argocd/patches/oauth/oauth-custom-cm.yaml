apiVersion: v1
data:
  sign_in.html: |
    {{define "sign_in.html"}}
    <!DOCTYPE html>
    <html lang="en" charset="utf-8">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>Sign In</title>
        <link rel="stylesheet" href="{{.ProxyPrefix}}/static/css/bulma.min.css">

        <style>
        body {
        height: 100vh;
        }
        .sign-in-box {
        max-width: 600px; /* Increased the max-width for a bigger box */
        margin: 2rem auto; /* Increased margin for better spacing */
        font-size: 1.5rem; /* Increased font size for all text inside */
        }
        .logo-box {
        margin: 2rem 4rem;
        }
        .alert {
        padding: 10px;
        background-color: #f44336;
        color: white;
        margin-bottom: 10px;
        border-radius: 5px;
        font-size: 1.25rem; /* Increased font size for alert */
        }
        .closebtn {
        margin-left: 15px;
        color: white;
        font-weight: bold;
        float: right;
        font-size: 28px; /* Increased the font size for the close button */
        line-height: 24px;
        cursor: pointer;
        transition: 0.3s;
        }
        .closebtn:hover {
        color: black;
        }
        .button {
        font-size: 1.5rem; /* Increased button text size */
        padding: 1rem 1.5rem; /* Increased button padding */
        }
        .input {
        font-size: 1.25rem; /* Increased input field text size */
        padding: 0.75rem; /* Increased padding for input fields */
        }
        #logoimage {
        max-width: 100%; /* Make logo bigger but constrained by the container */
        height: auto;
        }
    </style>

        </head>
        <body class="has-background-dark">
        <section class="section has-background-dark">
        <div class="box block sign-in-box has-text-centered">
            <div class="block logo-box">
            <img id="logoimage" src="data:text/plain;base64," class="img-fluid" alt="IMCITE">
            </div>

            <form method="GET" action="{{.ProxyPrefix}}/start">
            <input type="hidden" name="rd" value="{{.Redirect}}">
                {{ if .SignInMessage }}
                <p class="block">{{.SignInMessage}}</p>
                {{ end}}
                <button type="submit" class="button block" style="background-color: #b8c1ca; border-color: #b8c1ca;">
                    <img src="data:image/svg+xml;charset=utf-8;base64," alt="" width="32" height="32" style="margin-right: 16px; vertical-align: middle;">
                    Sign in to IMCITE
                </button>
            </form>
        </div>
        </section>

        <script>
        if (window.location.hash) {
            (function() {
            var inputs = document.getElementsByName('rd');
            for (var i = 0; i < inputs.length; i++) {
                // Add hash, but make sure it is only added once
                var idx = inputs[i].value.indexOf('#');
                if (idx >= 0) {
                // Remove existing hash from URL
                inputs[i].value = inputs[i].value.substr(0, idx);
                }
                inputs[i].value += window.location.hash;
            }
            })();
        }
        </script>
        </body>
    </html>
    {{end}}
kind: ConfigMap
metadata:
  name: oauth2-proxy-custom-templates
  namespace: default