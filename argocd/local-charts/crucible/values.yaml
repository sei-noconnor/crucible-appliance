gitea:
  redis-cluster:
    enabled: false
  redis:
    enabled: false
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  image:
    repository: gitea/gitea
    tag: "1.23.1"
    rootless: false
  ingress:
    enabled: true
    apiVersion: networking.k8s.io/v1
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
      nginx.ingress.kubernetes.io/use-regex: "true"
      cert-manager.io/cluster-issuer: ca-issuer
      nginx.ingress.kubernetes.io/proxy-body-size: 6g
      nginx.ingress.kubernetes.io/server-snippet: |
        location ~ ^/(gitea|v2)($|/) {
          client_max_body_size 6g;
          rewrite ^ $request_uri;
          rewrite ^/(gitea($|/))?(.*) /$3 break;
          proxy_pass http://appliance-gitea-http.gitea.svc.cluster.local:3000$uri;

          proxy_set_header Connection $http_connection;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
    hosts:
      - host: ${DOMAIN}
        paths:
          - path: /(gitea|v2)(/|$)
            pathType: ImplementationSpecific
    tls:
      - secretName: gitea-tls
        hosts:
          - ${DOMAIN}
  persistence:
    enabled: true
  initPreScript: ""
  actions:
    enabled: true
    statefulset:
      actRunner:
        config: "log: \n  level: debug\ncache: \n  enabled: false\nrunner:\n  labels:\n    - \"crucible:docker://${DOMAIN}/fortress-manifests/node:20-bookworm-slim\"\n    - \"ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04\"\n    - \"builder:host\"\ncontainer:\n  options: \"-v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt -e NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt\"\n  valid_volumes: \n    - \"/etc/ssl/certs/ca-certificates.crt\"\n  force_pull: false\n  force_rebuild: false\n"
    provisioning:
      enabled: true
  gitea:
    admin:
      username: administrator
      password: ${ADMIN_PASS}
      email: "administrator@${DOMAIN}"
    config:
      APP_NAME: Crucible Gitea
      server:
        DOMAIN: ${DOMAIN}
        ROOT_URL: https://${DOMAIN}/gitea
      database:
        DB_TYPE: postgres
        HOST: appliance-postgresql.postgres.svc.cluster.local:5432
        NAME: gitea
        USER: postgres
        PASSWD: ${ADMIN_PASS}
        SCHEMA: public
      indexer:
        ISSUE_INDEXER_TYPE: bleve
        REPO_INDEXER_ENABLED: true
      cache:
        ADAPTER: memory
      actions:
        ENABLED: true
      security:
        PASSWORD_COMPLEXITY: "off"
      repository:
        DEFAULT_BRANCH: main
        DEFAULT_PUSH_CREATE_PRIVATE: false
        ENABLE_PUSH_CREATE_USER: true
        ENABLE_PUSH_CREATE_ORG: true
