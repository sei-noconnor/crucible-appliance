apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mkdocs
resources:
- namespace.yaml

helmCharts:
- name: mkdocs-material
  includeCRDs: true
  version: 0.2.3
  repo: https://helm.cmusei.dev/charts
  releaseName: appliance
  namespace: mkdocs
  valuesFile: files/docs-appliance.values.yaml

secretGenerator:
- name: crucible-certs
  files:
  - crucible-ca.crt=files/root-ca.pem

generatorOptions:
  disableNameSuffixHash: true