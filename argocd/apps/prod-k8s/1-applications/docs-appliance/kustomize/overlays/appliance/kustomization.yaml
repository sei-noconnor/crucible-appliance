apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mkdocs
resources:
- ../../base

configMapGenerator:
  - name: crucible-certs
    files:
    - files/root-ca.pem=files/root-ca.pem

secretGenerator:
- name: crucible-certs
  files:
  - crucible-ca.crt=files/root-ca.pem

