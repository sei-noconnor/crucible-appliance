  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  health: {}
    # livenessProbe:
    #   initialDelaySeconds: 10
    #   httpGet:
    #     path: /api/version
    #     port: http
    # startupProbe:
    #   initialDelaySeconds: 30
    #   httpGet:
    #     path: /api/version
    #     port: http
    #   failureThreshold: 9
    #   periodSeconds: 10

  # storage - either an existing pvc, the size for a new pvc, or emptyDir
  storage:
    size: "10Gi"
    mode: ReadWriteOnce
    class: longhorn

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 200m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ## migrations sets how data migrations run
  ## If enabled, all replicas will wait until a single migration job runs.
  ## this is important if running multiple replicas or if you use different
  ## connection strings (permissions) for building the database versus using it.
  ## If using a single connection string, no need to specify here. It will use values
  ## from `env` below.
  ## NOTE: the serviceAccount must have permission to `get batch.jobs`.
  ## If you create the serviceAccount above, it will get a RoleBinding to a Role with that allowed.
  migrations:
    enabled: false
    restartPolicy: Never
    Database__Provider: ""
    Database__ConnectionString: ""
    env: {}

  # Config app settings with environment vars.
  # Those most likely needing values are listed. For others,
  # see https://github.com/cmu-sei/gameboard/blob/master/src/Gameboard.Api/appsettings.conf

  ## giturl is the url of the git repository of static markdown
  giturl: ""
  ## gitbranch sets which repo branch to publish
  gitbranch: ""
  ## pollInterval sets minutes between git pull
  pollInterval: 5

  env:
    PathBase: ""
    Oidc__Audience: gameboard-api
    Oidc__Authority: https://<path:fortress-prod/data/shared#domain>/<path:fortress-prod/data/shared#oauth-provider>/<path:fortress-prod/data/shared#oauth-authority-url>
    OpenApi__Client__ClientId: gameboard-api
    OpenApi__Client__AuthorizationURL: https://<path:fortress-prod/data/shared#domain>/<path:fortress-prod/data/shared#oauth-provider>/<path:fortress-prod/data/shared#oauth-authorization-url>
    OpenApi__Client__TokenURL: https://<path:fortress-prod/data/shared#domain>/<path:fortress-prod/data/shared#oauth-provider>/<path:fortress-prod/data/shared#oauth-token-url>
    OpenApi__Enabled: true

    Database__Provider: PostgreSQL
    Database__ConnectionString: <path:fortress-prod/data/gameboard#gameboard-db-connection-string>

    Core__GameEngineUrl: https://topomojo.<path:fortress-prod/data/shared#domain>
    Core__GameEngineClientName: bot-gameboard
    Core__GameEngineClientSecret: dUtapghdvXySO9zTYPZbM1JExuB9Lc59
    Core__ChallengeDocUrl: https://topomojo.<path:fortress-prod/data/shared#domain>
    Core__SafeNamesFile: conf/safenames.json
    Core__KeyPrefix: PHL-OP

    Headers__Cors__Origins__0: gameboard.<path:fortress-prod/data/shared#domain>
    Headers__Cors__Methods__0: "*"
    Headers__Cors__Headers__0: "*"
    Headers__Cors__AllowCredentials: true
    Logging__LogLevel__Microsoft.Hosting.Lifetime: Information
    Logging__LogLevel__Microsoft: Information
    Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    Logging__LogLevel__Microsoft.AspNetCore.Routing: Warning
    Logging__LogLevel__System.Net.Http.HttpClient.ITopoMojoApiClient: Warning
    Logging__LogLevel__Microsoft.AspNetCore.Mvc.Infrastructure.ObjectResultExecutor: Warning
    Logging__LogLevel__Microsoft.AspNetCore.Mvc.Infrastructure.ControllerActionInvoker: Warning
    Logging__LogLevel__Gameboard.Api.JobService: Warning

gameboard-ui:
  # Default values for gameboard-ui.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.

  replicaCount: 1

  image:
    repository: cmusei/gameboard-ui
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "3.30.0"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: <path:fortress-prod/data/shared#ingress-class>
      nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
      nginx.ingress.kubernetes.io/use-regex: "true"
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: gameboard.<path:fortress-prod/data/shared#domain>
        paths:
          - path: "/(.*)"
            pathType: ImplementationSpecific
    tls:
      - secretName: gameboard.<path:fortress-prod/data/shared#domain>-tls
        hosts:
          - gameboard.<path:fortress-prod/data/shared#domain>

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 20m
      memory: 20Mi
    requests:
      cpu: 10m
      memory: 10Mi
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 20m
    #   memory: 20Mi
    # requests:
    #   cpu: 10m
    #   memory: 10Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ## basehref is path to the app
  basehref: ""

  ## faviconsUrl is a url to tgz of icon bundle. If bundle has favicon.html,
  ## its contents will be merged into index.html head element.
  # faviconsUrl: "https://some.url/favs.tgz"

    ## openGraph is string of html head metadata (single line!)
  openGraph: >-
    <!-- Open Graph info for link previews -->
    <meta property="og:title" content="PHL-OP Gameboard" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gameboard.<path:fortress-prod/data/shared#domain>" />
    <meta property="og:image" content="" />
    <meta property="og:description" content="PHL-OP Gameboard" />

  ## settings is stringified json that gets included as assets/settings.json
  settings: |
    {
      "appname": "PHL-OP Gameboard",
      "apphost": "",
      "mkshost": "",
      "tocfile": "",
      "oidc": {
        "client_id": "gameboard-ui",
        "authority": "https://<path:fortress-prod/data/shared#domain>/<path:fortress-prod/data/shared#oauth-provider>/<path:fortress-prod/data/shared#oauth-authority-url>",
        "redirect_uri": "https://gameboard.<path:fortress-prod/data/shared#domain>/oidc",
        "silent_redirect_uri": "https://gameboard.<path:fortress-prod/data/shared#domain>/oidc-silent.html",
        "response_type": "code",
        "scope": "openid profile gameboard-api topomojo-api",
        "automaticSilentRenew": true,
        "includeIdTokenInSilentRenew": false,
        "filterProtocolClaims": true,
        "loadUserInfo": true,
        "checkSessionInterval": 30000,
        "accessTokenExpiringNotificationTime": 120,
        "monitorSession": false,
        "loadUserInfo": true,
        "useLocalStorage": true,
        "autoLogin": true,
        "autoLogout": false
      }
    }