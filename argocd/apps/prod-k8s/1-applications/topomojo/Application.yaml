apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topomojo
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - path: argocd/apps/topomojo/kustomize/overlays/appliance
    repoURL: https://onprem.twn-imcite.net/gitea/fortress-manifests/crucible-appliance.git
    targetRevision: main

