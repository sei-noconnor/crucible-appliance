cite-api:
  image:
    tag: 1.6.1
    pullPolicy: "IfNotPresent"

  # Ingress configuration example for NGINX
  # TLS and Host URLs need configured
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: <path:fortress-prod/data/shared#ingress-class>
      nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: cite.<path:fortress-prod/data/shared#domain>
        paths:
          - path: /(api|swagger|hubs)
            pathType: ImplementationSpecific
    tls:
      - secretName: cite.<path:fortress-prod/data/shared#domain>-tls
        hosts:
          - cite.<path:fortress-prod/data/shared#domain>
  resources:
    requests:
      cpu: 1000m
      memory: 1024Mi

  certificateMap: "root-ca"

  env:
    PathBase: ""
    # CORS policy settings.
    # The first entry should be the URL to CITE
    CorsPolicy__Origins__0: https://cite.<path:fortress-prod/data/shared#domain>
    CorsPolicy__Origins__1: https://gallery.<path:fortress-prod/data/shared#domain>
    CorsPolicy__AllowAnyHeader: true

    # Connection String to database
    ConnectionStrings__PostgreSQL: <path:fortress-prod/data/cite#cite-db-connection-string>
    Database__Provider: PostgreSQL
    Database__SeedFile: seed-data.json
    Database__AutoMigrate: true
    Database__DevModeRecreate: false

    # OAuth2 Identity Client for Application
    Authorization__Authority: https://<path:fortress-prod/data/shared#domain>/keycloak/realms/crucible
    Authorization__AuthorizationUrl: https://<path:fortress-prod/data/shared#domain>/keycloak/realms/crucible/protocol/openid-connect/auth
    Authorization__TokenUrl: https://<path:fortress-prod/data/shared#domain>/keycloak/realms/crucible/protocol/openid-connect/token
    Authorization__AuthorizationScope: "openid cite-api profile gallery-api"
    Authorization__ClientId: "cite-api"
    Authorization__ClientName: "CITE API"

    # OAuth2 Identity Client /w Password
    ResourceOwnerAuthorization__Authority: https://<path:fortress-prod/data/shared#domain>/keycloak/realms/crucible
    ResourceOwnerAuthorization__ClientId: cite-admin
    ResourceOwnerAuthorization__UserName: "cite.admin"
    ResourceOwnerAuthorization__Password: <path:fortress-prod/data/shared#crucible-admin-pass>
    ResourceOwnerAuthorization__Scope: "openid cite-api gallery-api"

    ClientSettings__GalleryApiUrl: https://gallery.<path:fortress-prod/data/shared#domain>

    Logging__Debug__LogLevel__System: "Information"
    Logging__Debug__LogLevel__Default: "Information"
    Logging__Debug__LogLevel__Microsoft: "Information"
    Logging__Debug__FormatterName: "json"
    Logging__Debug__FormatterOptions__SingleLine: true
    Logging__Debug__FormatterOptions__TimestampFormat: "HH:mm:ss"
    Logging__Debug__FormatterOptions__UseUtcTimestamp: true
    Logging__Console__LogLevel__System: "Information"
    Logging__Console__LogLevel__Default: "Information"
    Logging__Console__LogLevel__Microsoft: "Information"
    Logging__Console__FormatterName: "json"
    Logging__Console__FormatterOptions__SingleLine: true
    Logging__Console__FormatterOptions__TimestampFormat: "HH:mm:ss"
    Logging__Console__FormatterOptions__UseUtcTimestamp: true

# hin cite sei/cite -f cite.values.yaml
cite-ui:
  # Docker image release version
  image:
    tag: 1.6.1
    pullPolicy: "IfNotPresent"

  # Ingress configuration example for NGINX
  # TLS and Host URLs need configured
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: <path:fortress-prod/data/shared#ingress-class>
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: cite.<path:fortress-prod/data/shared#domain>
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: cite.<path:fortress-prod/data/shared#domain>-tls
        hosts:
          - cite.<path:fortress-prod/data/shared#domain>

  resources:
    requests:
      cpu: 200m
      memory: 10Mi
  env:
    APP_BASEHREF: ""
  # Config app settings with a JSON file.
  # These values correspond to an OpenID connect client and
  # some basic configuration
  settings: |
    {
    "ApiUrl": "https://cite.<path:fortress-prod/data/shared#domain>",
    "GalleryApiUrl": "https://gallery.<path:fortress-prod/data/shared#domain>",
    "GalleryUiUrl": "https://gallery.<path:fortress-prod/data/shared#domain>",
     "OIDCSettings": {
        "authority": "https://<path:fortress-prod/data/shared#domain>/keycloak/realms/crucible",
        "client_id": "cite-ui",
        "redirect_uri": "https://cite.<path:fortress-prod/data/shared#domain>/auth-callback",
        "post_logout_redirect_uri": "https://cite.<path:fortress-prod/data/shared#domain>",
        "response_type": "code",
        "scope": "openid profile cite-api gallery-api",
        "automaticSilentRenew": true,
        "silent_redirect_uri": "https://cite.<path:fortress-prod/data/shared#domain>/auth-callback-silent"
      },

    "AppTitle": "CITE",
    "AppTopBarHexColor": "#2d69b4",
    "AppTopBarImage": "/assets/img/account-group-white.png",
    "AppTopBarHexTextColor": "#FFFFFF",
    "AppTopBarText": "CITE  -  Collaborative Incident Threat Evaluator",
    "UseLocalAuthStorage": false,
    "DefaultScoringModelId": "d4b4e80c-0ce6-4601-9820-6802e70504b4",
    "DefaultEvaluationId": "2f82cb19-4c0a-4b60-857f-c4f2a9e70819",
    "DefaultTeamId": "cfe007a7-2dcf-40a9-b157-f3dee2005c7d"
    }
