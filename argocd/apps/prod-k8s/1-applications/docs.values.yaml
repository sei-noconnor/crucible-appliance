replicaCount: 1

image:
  repository: squidfunk/mkdocs-material
  pullPolicy: IfNotPresent
  tag: "latest"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: <path:fortress-prod/data/shared#ingress-class>
    cert-manager.io/cluster-issuer: ca-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 8g
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: 256k
    # nginx.ingress.kubernetes.io/auth-url: "https://auth.crucible.io/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://auth.crucible.io"
  hosts:
    - host: docs.crucible.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: docs.crucible.io-tls
      hosts:
        - docs.crucible.io

certificateMap: "root-ca"

mkdocs:
  site_url: https://docs.crucible.io
  site_dir: public

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 80

# storage - either an existing pvc, the size for a new pvc, or emptyDir (git requires a pvc)
storage:
    size: "5G"
    mode: "ReadWriteOnce"
    class: "longhorn"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

## giturl is the url of an MkDocs git repository
giturl: "https://gitlab.imcite.net/docs/docs.pages.imcite.net.git"

## gitbranch sets which repo branch to publish
gitbranch: "phl-onprem"

gitCredentialsSecret: "imcite-gitlab-docs-secret"

## pollInterval sets minutes between git pull
pollInterval: 5

