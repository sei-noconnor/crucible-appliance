image:
  repository: "quay.io/oauth2-proxy/oauth2-proxy"
  pullPolicy: "IfNotPresent"

ingress:
  enabled: true
  className: <path:fortress-prod/data/shared#ingress-class>
  path: /
  pathType: ImplementationSpecific
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 8g
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: 256k
  hosts:
    - auth.onprem.twn-imcite.net
  tls:
    - secretName: auth.onprem.twn-imcite.net-tls
      hosts:
        - auth.onprem.twn-imcite.net

service:
  type: ClusterIP
  portNumber: 80
  appProtocol: http

serviceAccount:
  enabled: true
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 50m
    memory: 100Mi
  requests:
    cpu: 10m
    memory: 50Mi

extraVolumes:
  - name: custom-templates
    configMap:
      name: oauth2-proxy-custom-templates
  - name: trusted-cacerts
    configMap:
      name: root-ca
      items:
        - key: root-ca.crt
          path: root-ca.crt


extraVolumeMounts:
  - name: custom-templates
    mountPath: "/data/custom-templates"
    readOnly: true
  - name: trusted-cacerts
    mountPath: /data/ca-certificates


proxyVarsAsSecrets: true

livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  timeoutSeconds: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

replicaCount: 1
revisionHistoryLimit: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false

podSecurityContext: {}
httpScheme: http

htpasswdFile:
  enabled: false

sessionStorage:
  type: cookie

redis:
  enabled: false

checkDeprecation: true

metrics:
  enabled: true
  port: 44180
  service:
    appProtocol: http
  serviceMonitor:
    enabled: false
    namespace: ""
    prometheusInstance: default
    interval: 60s
    scrapeTimeout: 30s
    labels: {}
    scheme: ""
    tlsConfig: {}
    bearerTokenFile: ""
    annotations: {}
    metricRelabelings: []
    relabelings: []

config:
  annotations: {}
  # The name of the cookie that oauth2-proxy will create
  # If left empty, it will default to the release name
  cookieName: ""
  google: {}

  configFile: |
    provider = "keycloak-oidc"
    provider_display_name = "Keycloak"
    redirect_url = "https://auth.onprem.twn-imcite.net/oauth2/callback"
    oidc_issuer_url = "https://<path:fortress-prod/data/shared#domain>/<path:fortress-prod/data/shared#oauth-provider>/<path:fortress-prod/data/shared#oauth-authority-url>"
    provider_ca_files = "/data/ca-certificates/root-ca.crt"
    client_id = "oauth2-proxy"
    client_secret = "Pho1tJJYZEYuOAOZ33uqblppMyYwVieM"
    cookie_secret = "UGhvMXRKSllaRVl1T0FPWjMzdXFibHBwTXlZd1ZpZU0"
    code_challenge_method = "S256"
    whitelist_domains = ["*.onprem.twn-imcite.net"]
    email_domains = ["*"]
    cookie_domains = [".onprem.twn-imcite.net"]
    cookie_expire = "1h"
    session_cookie_minimal = "true"
    insecure_oidc_allow_unverified_email = "true"
    custom_templates_dir = "/data/custom-templates"